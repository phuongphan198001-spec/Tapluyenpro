name: Build TapLuyenPro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission
        run: chmod +x TapLuyenPro/gradlew

      - name: Build APK
        working-directory: TapLuyenPro
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TapLuyenPro-APK
          path: TapLuyenPro/app/build/outputs/apk/debug/*.apk
          
